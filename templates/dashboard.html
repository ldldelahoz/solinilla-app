<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Solinilla</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        header { background: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button.danger { background: #e74c3c; }
        input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #ddd; cursor: pointer; }
        .tab.active { background: white; font-weight: bold; }
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ Solinilla</h1>
        <div>
            <button onclick="logout()">Salir</button>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('inv')">📦 Inventario</div>
            <div class="tab" onclick="switchTab('mov')">🔄 Movimientos</div>
            <div class="tab" onclick="switchTab('rep')">📊 Reportes</div>
        </div>

        <!-- INVENTARIO -->
        <div id="inv" class="section active">
            <div class="card">
                <h3>Productos</h3>
                <table id="inventory-table">
                    <thead><tr><th>ID</th><th>Nombre</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody id="inv-body"><tr><td colspan="4">Cargando...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- MOVIMIENTOS -->
        <div id="mov" class="section">
            <div class="card">
                <h3>Registrar Movimiento</h3>
                <select id="mov-prod"></select>
                <input type="number" id="mov-qty" placeholder="Cantidad" min="1">
                <select id="mov-type">
                    <option value="entrada">Entrada</option>
                    <option value="salida">Salida</option>
                </select>
                <button onclick="registerMovement()">Registrar</button>
            </div>
            <div class="card">
                <h3>Historial de Hoy</h3>
                <table id="mov-table">
                    <thead><tr><th>Tipo</th><th>Producto</th><th>Cant.</th></tr></thead>
                    <tbody id="mov-body"></tbody>
                </table>
            </div>
        </div>

        <!-- REPORTES -->
        <div id="rep" class="section">
            <div class="card">
                <h3>Cierre y Reportes</h3>
                <button onclick="cerrarInventario()">🔒 Cerrar Inventario del Día</button>
                <br><br>
                <button onclick="window.open('/api/reporte/imprimir', '_blank')">️ Imprimir Reporte</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        async function api(url, method='GET', body=null) {
            const res = await fetch(url, {
                method, headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                body: body ? JSON.stringify(body) : null
            });
            if (res.status === 401) logout();
            return res.json();
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }

        function switchTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
            if (id === 'inv') loadInventory();
            if (id === 'mov') loadMovements();
        }

        async function loadInventory() {
            const data = await api('/api/productos');
            const tbody = document.getElementById('inv-body');
            const select = document.getElementById('mov-prod');
            tbody.innerHTML = ''; select.innerHTML = '';
            
            data.productos.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.id}</td><td>${p.nombre}</td><td>${p.stock}</td>
                <td><button class="danger" onclick="delProd('${p.id}')">🗑️</button></td></tr>`;
                select.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
            });
        }

        async function loadMovements() {
            const data = await api('/api/movimientos');
            const tbody = document.getElementById('mov-body');
            tbody.innerHTML = '';
            data.movimientos.forEach(m => {
                tbody.innerHTML += `<tr><td>${m.tipo}</td><td>${m.producto_id}</td><td>${m.cantidad}</td></tr>`;
            });
        }

        async function registerMovement() {
            const prod = document.getElementById('mov-prod').value;
            const qty = parseFloat(document.getElementById('mov-qty').value);
            const type = document.getElementById('mov-type').value;
            if (!prod || !qty) return alert('Completa los datos');
            
            const res = await api('/api/movimientos', 'POST', {producto_id: prod, tipo: type, cantidad: qty});
            alert(res.msg);
            loadInventory(); loadMovements();
        }

        async function delProd(id) {
            if (confirm('¿Eliminar?')) {
                await api(`/api/productos/${id}`, 'DELETE');
                loadInventory();
            }
        }

        async function cerrarInventario() {
            const fecha = prompt('Fecha (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
            if (!fecha) return;
            const res = await api(`/api/cierre?fecha=${fecha}`, 'POST');
            alert(res.msg);
        }

        // Cargar al inicio
        loadInventory();
    </script>
</body>
</html>
