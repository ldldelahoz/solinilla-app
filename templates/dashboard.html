<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Solinilla</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #27ae60; 
            --warning: #f39c12; --bg: #f8f9fa; --white: #ffffff; --text: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }
        
        header { background-color: var(--primary); color: var(--white); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.2rem; }
        .btn-header { background: transparent; border: 1px solid rgba(255,255,255,0.6); color: var(--white); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        
        .tabs { display: flex; background: var(--white); border-bottom: 1px solid #ddd; position: sticky; top: 56px; z-index: 90; }
        .tab-btn { flex: 1; padding: 14px; text-align: center; cursor: pointer; border: none; background: none; font-weight: 500; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; background: #f0f7ff; }
        
        .section { padding: 15px; display: none; }
        .section.active { display: block; }
        .card { background: var(--white); padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card h3 { margin-bottom: 12px; color: var(--primary); font-size: 1rem; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; color: white; margin-top: 5px; }
        .btn-primary { background-color: var(--accent); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        
        table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f4f6f8; color: #444; font-weight: 600; }
        
        .stock-ok { color: var(--success); font-weight: 700; }
        .stock-low { color: var(--danger); font-weight: 700; } /* ROJO PARA STOCK BAJO */
        
        .action-group { display: flex; gap: 6px; justify-content: center; }
        .icon-btn { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .icon-add { background: var(--success); color: white; }
        .icon-sub { background: var(--warning); color: white; }
        .icon-del { background: var(--danger); color: white; }

        /* Estilo para opciones del select */
        option.stock-available { color: var(--success); font-weight: bold; }
        option.stock-empty { color: var(--danger); }

        @media (max-width: 600px) {
            .action-group { flex-direction: column; gap: 4px; }
            .icon-btn { width: 28px; height: 28px; font-size: 0.9rem; }
            th, td { padding: 10px 6px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ Solinilla</h1>
        <div style="display:flex; gap:10px;">
            <button class="btn-header" onclick="openPrintView()">🖨️ Imprimir</button>
            <button class="btn-header" onclick="logout()">Salir</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('inv')">📦 Inventario</button>
        <button class="tab-btn" onclick="switchTab('mov')">🔄 Movimientos</button>
        <button class="tab-btn" onclick="switchTab('rep')">📊 Reportes</button>
    </div>

    <!-- SECCIÓN INVENTARIO -->
    <div id="inv" class="section active">
        <div class="card">
            <h3>🔍 Buscar Producto</h3>
            <select id="search-select" onchange="highlightProduct()">
                <option value="">-- Selecciona un producto --</option>
            </select>
        </div>

        <div class="card" style="padding: 0; overflow-x: auto;">
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN MOVIMIENTOS -->
    <div id="mov" class="section">
        <div class="card">
            <h3>📝 Registrar Movimiento</h3>
            <label>Producto:</label>
            <select id="mov-product-select" onchange="document.getElementById('mov-product-id').value = this.value">
                <option value="">-- Selecciona producto --</option>
            </select>
            <input type="hidden" id="mov-product-id">
            
            <label>Cantidad:</label>
            <input type="number" id="mov-qty" placeholder="Cantidad" min="1" step="0.01">
            
            <label>Tipo:</label>
            <select id="mov-type">
                <option value="entrada">🟢 Entrada</option>
                <option value="salida"> Salida</option>
            </select>
            
            <label>Motivo:</label>
            <input type="text" id="mov-reason" placeholder="Ej: Proveedor X">
            <button class="btn btn-success" onclick="registerMovement()">✅ Registrar</button>
        </div>
        <div class="card">
            <h3>📅 Movimientos de Hoy</h3>
            <table id="movements-table">
                <thead><tr><th>Tipo</th><th>Producto</th><th>Cantidad</th><th>Motivo</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN REPORTES -->
    <div id="rep" class="section">
        <div class="card">
            <h3>📥 Generar Reporte PDF</h3>
            <label>Fecha:</label>
            <input type="date" id="report-date">
            <button class="btn btn-primary" onclick="downloadPDF()"> Descargar PDF</button>
        </div>
        <div class="card" style="border: 2px solid var(--danger); background: #fff5f5;">
            <h3 style="color: var(--danger);">🔒 Cerrar Inventario</h3>
            <p style="font-size: 0.9rem; margin-bottom: 10px;">Guarda el estado actual como cierre del día.</p>
            <input type="date" id="cierre-date">
            <button class="btn btn-danger" onclick="cerrarInventario()">🔒 CERRAR DÍA</button>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let token = localStorage.getItem('token');
        let productsData = [];

        if (!token) window.location.href = '/';

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if (tabId === 'inv') loadInventory();
            if (tabId === 'mov') loadMovements();
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }

        async function apiCall(url, method = 'GET', body = null) {
            const headers = { 'Authorization': 'Bearer ' + token };
            if (body) headers['Content-Type'] = 'application/json';
            const response = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : null });
            if (response.status === 401) logout();
            return response.json();
        }

        async function loadInventory() {
            const data = await apiCall('/api/productos');
            productsData = data.productos || [];
            
            const tbody = document.querySelector('#inventory-table tbody');
            const searchSelect = document.getElementById('search-select');
            const movSelect = document.getElementById('mov-product-select');
            
            tbody.innerHTML = '';
            searchSelect.innerHTML = '<option value="">-- Selecciona un producto --</option>';
            movSelect.innerHTML = '<option value="">-- Selecciona producto --</option>';

            productsData.forEach(p => {
                // Lógica para ROJO si stock es bajo (< 10)
                const isLow = p.stock < 10;
                const stockClass = isLow ? 'stock-low' : 'stock-ok';
                
                // Crear fila en tabla
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.nombre}</td>
                    <td class="${stockClass}">${p.stock}</td>
                    <td>
                        <div class="action-group">
                            <button class="icon-btn icon-add" onclick="quickAction('${p.id}', 'entrada')">➕</button>
                            <button class="icon-btn icon-sub" onclick="quickAction('${p.id}', 'salida')">➖</button>
                            <button class="icon-btn icon-del" onclick="deleteProduct('${p.id}')">🗑️</button>
                        </div>
                    </td>`;
                tbody.appendChild(tr);

                // Lógica para VERDE/ROJO en Select (Lista desplegable)
                const optionHTML = `<option value="${p.id}" class="${p.stock > 0 ? 'stock-available' : 'stock-empty'}">
                    ${p.nombre} (Stock: ${p.stock})
                </option>`;
                searchSelect.innerHTML += optionHTML;
                movSelect.innerHTML += optionHTML;
            });
        }

        function highlightProduct() {
            const selectedId = document.getElementById('search-select').value;
            if (!selectedId) return;
            const rows = document.querySelectorAll('#inventory-table tbody tr');
            rows.forEach(row => {
                if (row.cells[0].textContent === selectedId) {
                    row.style.backgroundColor = '#fff3cd';
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => { row.style.backgroundColor = ''; }, 2000);
                }
            });
        }

        function quickAction(id, type) {
            document.getElementById('mov-product-id').value = id;
            document.getElementById('mov-product-select').value = id;
            document.getElementById('mov-type').value = type;
            document.getElementById('mov-qty').value = '1';
            switchTab('mov');
        }

        async function deleteProduct(id) {
            if (!confirm('¿Eliminar producto?')) return;
            await apiCall(`/api/productos/${id}`, 'DELETE');
            loadInventory();
        }

        async function registerMovement() {
            const prodId = document.getElementById('mov-product-id').value || document.getElementById('mov-product-select').value;
            const qty = parseFloat(document.getElementById('mov-qty').value);
            const type = document.getElementById('mov-type').value;
            const reason = document.getElementById('mov-reason').value;

            if (!prodId || !qty || qty <= 0) return alert('Completa los datos');

            const res = await apiCall('/api/movimientos', 'POST', { producto_id: prodId, tipo: type, cantidad: qty, motivo: reason });
            alert(res.msg);
            document.getElementById('mov-qty').value = '';
            loadMovements();
            loadInventory();
        }

        async function loadMovements() {
            const today = new Date().toISOString().split('T')[0];
            const data = await apiCall(`/api/movimientos?fecha=${today}`);
            const tbody = document.querySelector('#movements-table tbody');
            tbody.innerHTML = '';
            (data.movimientos || []).forEach(m => {
                const color = m.tipo === 'entrada' ? 'green' : 'red';
                const icon = m.tipo === 'entrada' ? '🟢' : '';
                const pName = productsData.find(p => p.id === m.producto_id)?.nombre || m.producto_id;
                tbody.innerHTML += `<tr><td style="color:${color}">${icon} ${m.tipo}</td><td>${pName}</td><td>${m.cantidad}</td><td>${m.motivo || '-'}</td></tr>`;
            });
        }

        async function openPrintView() {
            const fecha = new Date().toISOString().split('T')[0];
            const url = `${API_BASE}/api/reporte/imprimir?fecha=${fecha}&token=${encodeURIComponent(token)}`;
            window.open(url, '_blank');
        }

        async function downloadPDF() {
            const fecha = document.getElementById('report-date').value;
            if (!fecha) return alert('Selecciona fecha');
            const url = `${API_BASE}/api/reporte/pdf?fecha=${fecha}&token=${encodeURIComponent(token)}`;
            window.location.href = url;
        }

        async function cerrarInventario() {
            const fecha = document.getElementById('cierre-date').value;
            if (!fecha) return alert('Selecciona fecha');
            if (!confirm('¿Cerrar inventario?')) return;
            const res = await apiCall(`/api/cierre?fecha=${fecha}`, 'POST');
            alert(res.msg);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('report-date').valueAsDate = new Date();
            document.getElementById('cierre-date').valueAsDate = new Date();
            loadInventory();
        });
    </script>
</body>
</html>
